services:
  agent_service:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
    init: true
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      SQLITE_DB_PATH: /app/runtime/checkpoints.db
      CUSTOMER_SUPPORT_DB_PATH: /app/runtime/customer_support.db
    volumes:
      - agent_runtime:/app/runtime
      - rag_chroma:/app/data/chroma
      - embedding_models:/app/data/models
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/ready', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  streamlit_app:
    build:
      context: .
      dockerfile: docker/Dockerfile.app
    init: true
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      AGENT_URL: http://agent_service:8080
      AUTH_SECRET: ${AUTH_SECRET:-}
    depends_on:
      agent_service:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

volumes:
  agent_runtime:
  rag_chroma:
  embedding_models:
