[project]
name = "agent-service-toolkit"
version = "0.1.0"
description = "Full toolkit for running an AI agent service built with LangGraph, FastAPI and Streamlit"
readme = "README.md"
authors = [{ name = "Joshua Carroll", email = "carroll.joshk@gmail.com" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

requires-python = ">=3.12,<3.15"

dependencies = [
    "aiosqlite >=0.20",
    "fastapi ~=0.138.2",
    "httpx ~=0.28.1",
    "langchain ~=1.3.11",
    "langchain-core ~=1.4.8",
    "langchain-chroma ~=1.1.0",
    "langchain-openai ~=1.3.3",
    "langgraph ~=1.2.7",
    "langgraph-checkpoint-sqlite ~=3.1.0",
    "pydantic ~=2.13.4",
    "pydantic-settings ~=2.14.2",
    "python-dotenv ~=1.2.2",
    "streamlit ~=1.58.0",
    "uvicorn ~=0.49.0",
    "fastembed>=0.8.0",
]

[dependency-groups]
dev = [
    "pre-commit",
    "pytest",
    "pytest-cov",
    "pytest-env",
    "pytest-asyncio",
    "ruff",
    "mypy ~=2.1.0",
]

# Group for the minimal dependencies to run just the client and Streamlit app.
# These are also installed in the default dependencies.
# To install run: `uv sync --frozen --only-group client`
client = [
    "httpx~=0.28.1",
    "pydantic ~=2.13.4",
    "python-dotenv ~=1.2.2",
    "streamlit~=1.58.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
extend-select = ["I", "U"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_default_fixture_loop_scope = "function"

[tool.pytest_env]
CUSTOMER_SUPPORT_MODE = "mock"

[tool.mypy]
plugins = "pydantic.mypy"
exclude = "src/streamlit_app.py"
